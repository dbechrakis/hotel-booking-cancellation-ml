# Mirrors the files the Dockerfile needs to a Hugging Face Docker Space, which builds and
# serves the image, then checks that the live /health reports the committed model.
# Inert until the repository has the HF_TOKEN secret and the HF_SPACE_ID variable
# (for example "your-username/hotel-cancellation-api").
name: Deploy to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'artifacts/**'
      - 'Dockerfile'
      - 'requirements-api.txt'
      - 'pyproject.toml'
      - 'scripts/deploy_huggingface.py'
      - 'deploy/huggingface/**'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-huggingface
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Check configuration
        run: test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN repository secret"; exit 1; }
      - run: python -m pip install huggingface_hub==2.2.0
      - name: Upload to the Space and wait until it serves the new model
        run: python scripts/deploy_huggingface.py
